<svg xmlns="http://www.w3.org/2000/svg" width="2006" height="784" viewBox="0 0 2006 784" role="img" aria-labelledby="title desc">
  <title id="title">Causal operating timeline</title>
  <desc id="desc">An English localization of the approved causal timeline. The timeline, six points, spacing, and horizontal composition remain unchanged.</desc>
  <image href="../causal_timeline.png" width="2006" height="784"/>
  <g>
    <rect x="215" y="130" width="670" height="104" fill="#fdf6ec"/><rect x="1280" y="130" width="630" height="104" fill="#fcf7ed"/>
    <rect x="760" y="278" width="510" height="62" fill="#fcf5ec"/>
    <rect x="64" y="346" width="250" height="108" fill="#fdf6ed"/><rect x="380" y="346" width="250" height="108" fill="#fdf6ec"/>
    <rect x="660" y="346" width="330" height="108" fill="#fcf6ed"/><rect x="1090" y="346" width="260" height="108" fill="#fdf6ed"/>
    <rect x="1370" y="346" width="335" height="108" fill="#fdf6ec"/><rect x="1720" y="346" width="245" height="108" fill="#fcf5ec"/>
    <rect x="0" y="590" width="2006" height="194" fill="#fdf6ec"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111" text-anchor="middle">
    <g font-size="52" font-style="italic" font-weight="700">
      <text x="550" y="205">Close of Session t</text>
      <text x="1605" y="205">Open of t+1</text>
    </g>
    <text x="1003" y="326" font-size="39">No Future Information</text>
    <g font-size="37" font-weight="400">
      <text x="190" y="399">Observed</text><text x="190" y="441">Data</text>
      <text x="500" y="399">EWMA</text><text x="500" y="441">Estimate</text>
      <text x="825" y="399">Exposure</text><text x="825" y="441">Decision</text>
      <text x="1220" y="420">Order</text>
      <text x="1535" y="399">Fill / No-fill</text><text x="1535" y="441">+ Costs</text>
      <text x="1840" y="399">Effective</text><text x="1840" y="441">Portfolio</text>
    </g>
  </g>
</svg>

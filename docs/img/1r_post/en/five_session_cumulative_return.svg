<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1600" viewBox="0 0 3200 1600" role="img" aria-labelledby="title desc">
  <title id="title">From five sessions to a cumulative return</title><desc id="desc">Five complete rows from matrix A compose a cumulative simple return for each instrument.</desc>
  <style>.bg{fill:#f7f5ef}.ink{fill:#292a2b}.muted{fill:#6d7171}.line{stroke:#292a2b;stroke-width:3}.soft{stroke:#d9ddd7;stroke-width:3}.sans{font-family:Arial,sans-serif}.math{font-family:Georgia,serif;font-style:italic}.title{font-size:67px}.sub{font-size:38px}.label{font-size:31px}.value{font-size:37px}.small{font-size:28px}</style>
  <rect class="bg" width="3200" height="1600"/>
  <text x="130" y="145" class="ink sans title">From five sessions to a cumulative return</text><text x="130" y="236" class="muted sans sub">One path · 125 instruments · H = 5 sessions</text>
  <text x="130" y="388" class="muted sans label">SELECT FIVE FULL ROWS FROM A</text><text x="2525" y="388" class="muted sans label">FINAL RESULT</text>
  <text x="160" y="490" class="muted sans label">Step</text><text x="380" y="490" class="muted sans label">Row from A</text><text x="750" y="490" class="ink sans label">AA</text><text x="1020" y="490" class="ink sans label">AAL</text><text x="1290" y="490" class="ink sans label">AAPL</text><text x="1540" y="490" class="ink sans label">…</text><text x="1780" y="490" class="ink sans label">XYZ</text><line x1="120" y1="550" x2="1920" y2="550" class="line"/>
  <rect x="120" y="588" width="1800" height="106" fill="#ebeee9"/>
  <text x="185" y="655" class="muted sans value">1</text><text x="380" y="655" class="muted sans value">A[417]</text><text x="720" y="655" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">1,1</tspan></text><text x="1000" y="655" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">1,2</tspan></text><text x="1270" y="655" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">1,3</tspan></text><text x="1545" y="655" class="muted sans value">…</text><text x="1720" y="655" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">1,125</tspan></text>
  <text x="185" y="785" class="muted sans value">2</text><text x="380" y="785" class="muted sans value">A[83]</text><text x="720" y="785" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">2,1</tspan></text><text x="1000" y="785" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">2,2</tspan></text><text x="1270" y="785" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">2,3</tspan></text><text x="1545" y="785" class="muted sans value">…</text><text x="1720" y="785" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">2,125</tspan></text>
  <text x="185" y="915" class="muted sans value">3</text><text x="380" y="915" class="muted sans value">A[1520]</text><text x="720" y="915" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">3,1</tspan></text><text x="1000" y="915" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">3,2</tspan></text><text x="1270" y="915" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">3,3</tspan></text><text x="1545" y="915" class="muted sans value">…</text><text x="1720" y="915" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">3,125</tspan></text>
  <text x="185" y="1045" class="muted sans value">4</text><text x="380" y="1045" class="muted sans value">A[690]</text><text x="720" y="1045" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">4,1</tspan></text><text x="1000" y="1045" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">4,2</tspan></text><text x="1270" y="1045" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">4,3</tspan></text><text x="1545" y="1045" class="muted sans value">…</text><text x="1720" y="1045" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">4,125</tspan></text>
  <text x="185" y="1175" class="muted sans value">5</text><text x="380" y="1175" class="muted sans value">A[213]</text><text x="720" y="1175" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">5,1</tspan></text><text x="1000" y="1175" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">5,2</tspan></text><text x="1270" y="1175" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">5,3</tspan></text><text x="1545" y="1175" class="muted sans value">…</text><text x="1720" y="1175" class="ink math value">ℓ<tspan baseline-shift="sub" font-size="23">5,125</tspan></text>
  <line x1="120" y1="1255" x2="1920" y2="1255" class="soft"/><text x="785" y="1335" class="muted sans label">5 × 125 daily log returns</text>
  <path d="M1985 850 H2175 M2175 850 l-20 -14 M2175 850 l-20 14" fill="none" class="line"/>
  <text x="2010" y="710" class="muted sans label">Compound</text><text x="1970" y="762" class="muted sans label">by instrument</text>
  <text x="2470" y="478" class="muted sans sub">The same path</text><text x="2270" y="705" class="ink sans label">AA</text><text x="2520" y="705" class="ink sans label">AAL</text><text x="2765" y="705" class="ink sans label">…</text><text x="2975" y="705" class="ink sans label">XYZ</text><line x1="2200" y1="756" x2="3100" y2="756" class="line"/>
  <rect x="2200" y="792" width="900" height="130" fill="#ebeee9"/><text x="2280" y="870" class="ink math value">R<tspan baseline-shift="sub" font-size="23">1</tspan></text><text x="2510" y="870" class="ink math value">R<tspan baseline-shift="sub" font-size="23">2</tspan></text><text x="2730" y="870" class="ink sans value">…</text><text x="2930" y="870" class="ink math value">R<tspan baseline-shift="sub" font-size="23">125</tspan></text><line x1="2200" y1="973" x2="3100" y2="973" class="soft"/>
  <text x="2385" y="1065" class="muted sans label">1 × 125 cumulative simple returns</text><text x="2385" y="1125" class="muted sans label">over five sessions</text>
  <text x="2365" y="1300" class="ink math" font-size="52">R<tspan baseline-shift="sub" font-size="27">j</tspan> = exp( Σ ℓ<tspan baseline-shift="sub" font-size="27">h,j</tspan>) − 1</text><text x="2670" y="1350" class="ink math" font-size="25">h = 1</text><text x="2718" y="1208" class="ink math" font-size="25">5</text>
  <line x1="130" y1="1415" x2="3070" y2="1415" class="soft"/><text x="130" y="1495" class="ink sans small">Repeat for 10,000 paths → final matrix of 10,000 × 125 cumulative returns.</text><text x="130" y="1570" class="muted sans small">Symbolic representation · illustrative historical indices · Draws are independent and with replacement.</text>
</svg>

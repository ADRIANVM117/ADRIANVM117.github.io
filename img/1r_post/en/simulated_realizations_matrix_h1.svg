<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1440" viewBox="0 0 3000 1440" role="img" aria-labelledby="title desc">
  <title id="title">Simulated realizations matrix</title><desc id="desc">Matrix B containing 10,000 simulated one-session realizations across 125 instruments.</desc>
  <style>.bg{fill:#f7f5ef}.ink{fill:#292a2b}.muted{fill:#6d7171}.line{stroke:#292a2b;stroke-width:3}.soft{stroke:#d9ddd7;stroke-width:3}.sans{font-family:Arial,sans-serif}.math{font-family:Georgia,serif;font-style:italic}.title{font-size:68px}.sub{font-size:39px}.label{font-size:35px}.value{font-size:48px}.index{font-size:37px}.small{font-size:31px}</style>
  <rect class="bg" width="3000" height="1440"/>
  <text x="110" y="180" class="ink math" font-size="115">B</text><text x="280" y="143" class="ink sans title">Simulated realizations matrix</text><text x="280" y="222" class="muted sans sub">10,000 realizations × 125 instruments · H = 1 session</text>
  <text x="1670" y="362" class="muted sans label">INSTRUMENTS</text><line x1="1548" y1="406" x2="2830" y2="406" class="soft"/>
  <text x="468" y="486" class="muted sans label">Realization</text><text x="706" y="486" class="ink sans label">AA</text><text x="1015" y="486" class="ink sans label">AAL</text><text x="1305" y="486" class="ink sans label">AAPL</text><text x="1815" y="486" class="ink sans label">…</text><text x="2135" y="486" class="ink sans label">XOM</text><text x="2490" y="486" class="ink sans label">XYZ</text><line x1="320" y1="542" x2="2700" y2="542" class="line"/>
  <rect x="320" y="574" width="2380" height="112" fill="#ebeee9"/>

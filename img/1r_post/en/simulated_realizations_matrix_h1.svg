  <text x="238" y="1000" class="muted sans value">⋮</text><text x="705" y="1000" class="muted sans value">⋮</text><text x="1015" y="1000" class="muted sans value">⋮</text><text x="1305" y="1000" class="muted sans value">⋮</text><text x="1815" y="1000" class="muted sans value">⋱</text><text x="2135" y="1000" class="muted sans value">⋮</text><text x="2490" y="1000" class="muted sans value">⋮</text>
